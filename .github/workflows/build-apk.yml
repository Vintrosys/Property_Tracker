name: Build APK

# Builds an Android APK that opens /property-tracker on your Frappe site.
# Set the site once under Settings → Secrets and variables → Actions → Variables
# as SITE_URL (e.g. https://erp.example.com), or enter it when running manually.
#
# Signed release builds (recommended, so new versions install over old ones):
# add these repository secrets; without them a debug APK is built instead.
#   ANDROID_KEYSTORE_BASE64   base64 of your .keystore / .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Frappe site URL, e.g. https://erp.example.com (leave empty to use the SITE_URL variable)"
        required: false
  push:
    branches: [main, develop]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    if: ${{ inputs.site_url != '' || vars.SITE_URL != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      SITE_URL: ${{ inputs.site_url || vars.SITE_URL }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Point the app at the Frappe site
        run: npm run configure

      - name: Create Android project
        run: npx cap add android

      - name: Allow GPS, camera and on-time reminder alarms
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -c "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: Notification icon
        run: cp -r android-res/* android/app/src/main/res/

      - name: App icon and splash screen
        run: npx capacitor-assets generate --android

      - name: Version and signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key set: building a debug APK. Debug builds can't be installed over a previous build (uninstall first). Add the ANDROID_KEYSTORE_* secrets for signed release builds."
          fi
          # versionCode/versionName from the build; release signing from the environment
          cat >> android/app/build.gradle <<'GRADLE'

          // ---- added by .github/workflows/build-apk.yml ----
          android {
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
                  versionName System.getenv("VERSION_NAME") ?: "1.0.0"
              }
              signingConfigs {
                  release {
                      if (System.getenv("KEYSTORE_FILE")) {
                          storeFile file(System.getenv("KEYSTORE_FILE"))
                          storePassword System.getenv("KEYSTORE_PASSWORD")
                          keyAlias System.getenv("KEY_ALIAS")
                          keyPassword System.getenv("KEY_PASSWORD")
                      }
                  }
              }
              buildTypes {
                  release {
                      if (System.getenv("KEYSTORE_FILE")) {
                          signingConfig signingConfigs.release
                      }
                  }
              }
          }
          GRADLE

      - name: Sync and build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx cap sync android
          cd android && chmod +x gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "../property-tracker-${VERSION_NAME}-${VERSION_CODE}.apk"
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../property-tracker-${VERSION_NAME}-${VERSION_CODE}-debug.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: property-tracker-apk
          path: mobile/property-tracker-*.apk
          if-no-files-found: error
